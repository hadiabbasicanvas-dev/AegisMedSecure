version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: aegis_medsecure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: aegis-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:Password123!@postgres:5432/aegis_medsecure?schema=public"
      JWT_SECRET: "aegis_guardian_super_secret_jwt_key_2026_qih"
      JWT_REFRESH_SECRET: "aegis_guardian_refresh_jwt_key_2026_qih"
      CLIENT_URL: "http://localhost:5173"
      OPENAI_API_KEY: "sk-proj-simulated-qih-key"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: aegis-frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: "http://localhost:5000/api/v1"
    depends_on:
      - backend

volumes:
  postgres_data:
